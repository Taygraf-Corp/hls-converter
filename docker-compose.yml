services:
  video-migration:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Supabase Configuration
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      
      # Storage Configuration
      - SOURCE_BUCKET=${SOURCE_BUCKET:-videos}
      - SOURCE_FOLDER=${SOURCE_FOLDER:-Videos}
      - TARGET_BUCKET=${TARGET_BUCKET:-hls-videos}
      - TARGET_FOLDER=${TARGET_FOLDER:-converted}
      
      # Server Configuration
      - PORT=${PORT:-3000}
      
      # Processing Configuration
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-3}
      - TEMP_DIR=${TEMP_DIR:-./temp}
      
      # HLS Configuration (optional)
      - HLS_SEGMENT_DURATION=${HLS_SEGMENT_DURATION:-6}
      - HLS_PLAYLIST_TYPE=${HLS_PLAYLIST_TYPE:-vod}
      
      # Node.js Configuration
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=4096}
    
    volumes:
      # Mount temp directory for video processing
      - ./temp:/app/temp
    
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

