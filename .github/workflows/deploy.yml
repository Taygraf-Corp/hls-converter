name: Deploy to AWS

# Manual only. Merging to main deploys nothing (CTO review 2026-11-02, finding 4:
# a push-triggered deploy targeted us-east-1, ran `cdk deploy` without review and
# rolled the service onto the mutable `latest` tag).
#
# This workflow does an image-only rollout pinned to an immutable digest via
# scripts/deploy-image-pinned.sh, which copies the CURRENT task definition and
# changes only the image, and records the previous revision as the rollback
# target. Infrastructure (CDK) changes are not deployed from here; run
# `scripts/deploy.sh --infra-only -c imageDigest=...` by hand after `cdk diff`.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = read-only; register = push image + register task def only; apply = also roll out'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - register
          - apply
      confirm:
        description: 'Type the production service name (hls-converter-service) to confirm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hls-converter-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  EXPECTED_ACCOUNT: '442956083883'
  ECR_REPOSITORY: hls-converter
  ECS_SERVICE: hls-converter-service
  ECS_CLUSTER: hls-converter-cluster

jobs:
  deploy:
    name: Pinned image rollout
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'hls-converter-service'
        run: |
          echo "Confirmation does not match; nothing was done." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Typecheck and test
        run: |
          npm ci
          npx tsc --noEmit
          npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        if: inputs.mode != 'plan'
        uses: docker/setup-buildx-action@v3

      - name: Roll out
        run: |
          case "${{ inputs.mode }}" in
            plan) scripts/deploy-image-pinned.sh --plan ;;
            register) scripts/deploy-image-pinned.sh ;;
            apply) scripts/deploy-image-pinned.sh --apply ;;
          esac

      - name: Keep the deploy record
        if: always() && inputs.mode != 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-record-${{ github.sha }}
          path: deploy-records/
          if-no-files-found: ignore
          retention-days: 400
