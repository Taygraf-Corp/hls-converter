name: CI

# Pull-request safety gate for the HLS converter service.
#
# Validates that both the service (src/) and the AWS CDK infra (infra/) typecheck
# cleanly before a change can be merged. This does NOT build a Docker image, deploy,
# or touch AWS in any way — it is a static gate only. Production deployment remains
# governed by deploy.yml, which is manual-only.
#
# Tests (node:test, `npm test`) cover the HLS policy and the conversion/revoke
# routes against an in-memory Supabase stand-in with the bundled ffmpeg. They
# make no network calls.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck (src + infra)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (service)
        run: npm ci

      - name: Typecheck service (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Unit and route tests
        run: npm test

      - name: Backfill and deploy-script tests (offline, fake AWS)
        run: python3 -m unittest tests/test_backfill_hls.py tests/test_deploy_pinned.py

      - name: Install dependencies (infra / CDK)
        run: npm ci
        working-directory: infra

      - name: Typecheck infra (tsc --noEmit)
        run: npx tsc --noEmit
        working-directory: infra
